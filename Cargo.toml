[package]
name = "cargo-cratesup"
version = "0.1.4"
edition = "2021"
license = "MIT"
authors = ["Ali Mehasin"]
repository = "https://github.com/alimehasin/cargo-cratesup"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cargo", "cargo-subcommand", "dependency", "update", "check"]
description = "A Cargo subcommand that scans your Cargo.toml dependencies and checks for available updates to help you keep your dependencies up-to-date."


[dependencies]
ureq = "3.4.2"
semver = "1.0.28"
colored = "3.1.1"
indicatif = "0.18.6"
toml_edit = "0.25.17"
serde_json = "1.0.151"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
